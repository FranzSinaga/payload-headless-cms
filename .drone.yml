kind: pipeline
type: ssh
name: payload-cms

clone:
  disable: true

server:
  host:
    from_secret: DEPLOY_HOST
  user:
    from_secret: DEPLOY_USERNAME
  ssh_key:
    from_secret: DEPLOY_SSH_KEY

steps:
  - name: Checkout & Pull
    environment: &project_env
      PROJECT_PATH:
        from_secret: APP_DIR
    commands:
      - echo "=== Checkout branch and pull latest code ==="
      - cd $PROJECT_PATH
      - git checkout master
      - git pull origin master
  - name: Verify
    environment: *project_env
    commands:
      - echo "=== Typecheck and lint ==="
      - cd $PROJECT_PATH
      - docker run --rm -e CI=true -v "$PWD":/app -w /app node:20-alpine sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm exec tsc --noEmit && pnpm run lint"
  - name: Build
    environment: *project_env
    commands:
      - echo "=== Building Application ==="
      - cd $PROJECT_PATH
      - docker compose build --no-cache
  - name: Deploy
    environment: *project_env
    commands:
      - echo "=== Run migrations, stop old service and start the new one ==="
      - cd $PROJECT_PATH
      - docker compose down
      - docker compose run --rm migrate
      - docker compose up -d
  - name: Cleanup
    commands:
      - echo "=== Cleanup the service ==="
      - docker system prune -f

trigger:
  event:
    - push
  branch:
    - master
